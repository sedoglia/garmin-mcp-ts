name: Dependabot auto-merge

# Merges Dependabot's security patches and its grouped minor/patch version
# updates without review, but only after the project has been built from the
# pull request's own head commit on both supported Node versions. Major bumps
# arrive as separate pull requests outside the version-updates group and still
# wait for a human.
#
# Nothing here pushes to the pull request branch. A commit pushed there with
# GITHUB_TOKEN makes GitHub open pull_request runs for github-actions[bot],
# which this public repository holds for approval as a first-time contributor,
# so every bump sat behind "Approve and run". The SBOM, which Dependabot does
# not regenerate, is brought up to date on main after the merge instead, by
# sbom-sync.yml.
on: pull_request

permissions:
  contents: read

# A newer Dependabot push supersedes whatever this run was about to merge.
concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      auto-merge: >-
        ${{ steps.meta.outputs.dependency-group == 'security-patches'
        || steps.meta.outputs.dependency-group == 'version-updates'
        || steps.meta.outputs.ghsa-id != '' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The same checks CI runs, minus the SBOM one: sbom.cdx.json is stale on
  # every lockfile bump until sbom-sync.yml catches up on main.
  verify:
    needs: metadata
    if: needs.metadata.outputs.auto-merge == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: the packages being installed are exactly the ones
      # that just changed. Optional dependencies stay in, though: tsc is
      # shipped as one.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check manifest is in sync
        run: npm run check:manifest

      - name: Validate manifest against the MCPB schema
        run: npm run validate:manifest

      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # No approving review here: GITHUB_TOKEN is barred from approving pull
      # requests, and main requires no review anyway - the builds above are
      # what gate this. --match-head-commit pins the merge to the head they
      # built.
      - name: Merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"

      # A merge made with GITHUB_TOKEN starts no workflows on main, and
      # workflow_dispatch is the one event that token is allowed to fire.
      # sbom-sync commits the regenerated SBOM and then runs CI on main.
      - name: Sync the SBOM on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sbom-sync.yml --repo "$GITHUB_REPOSITORY" --ref main
