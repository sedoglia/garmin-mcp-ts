name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Both ends of the supported range. engines says >=22, and a floor that
    # nothing ever runs is a claim rather than a guarantee - 24 alone would
    # never notice the day something stops working on 22.
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Optional dependencies must stay in: TypeScript ships its native
      # compiler binary as one (@typescript/typescript-<platform>), so
      # --omit=optional breaks tsc outright. keytar is optional too and is
      # allowed to fail here; npm treats that as non-fatal by design.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The manifest is what the MCP Directory reads. When its tool list or
      # version drifts from the code, the submission is rejected long after
      # the merge that caused it.
      - name: Check manifest is in sync
        run: npm run check:manifest

      - name: Validate manifest against the MCPB schema
        run: npm run validate:manifest

      # Reported, not enforced: a fresh advisory should not turn unrelated
      # pull requests red.
      - name: Audit
        run: npm audit --audit-level=high
        continue-on-error: true
