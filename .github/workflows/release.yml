name: Release

# The .mcpb bundle attached to a release is the artifact submitted to the MCP
# Directory. It is built here, from the tagged commit, rather than by hand on a
# developer machine, so what users download is what the tag contains.
#
# Two ways in: pushing a v* tag, or running the workflow manually against a
# branch, in which case it creates the tag itself. The manual route exists
# because pushing a tag is not always available to whoever is cutting the
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v4.3.1). Created from the selected branch if it does not exist yet."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # No explicit ref: a tag push checks out the tag, a manual run checks out
      # the branch it was dispatched against. fetch-depth 0 so the tag can be
      # created and pushed from here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "name=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check manifest is in sync
        run: npm run check:manifest

      - name: Validate manifest against the MCPB schema
        run: npm run validate:manifest

      # A release tagged v4.3.1 carrying a 4.3.0 manifest is the first thing a
      # reviewer notices, so the tag and the manifest have to agree. Checked
      # before the tag is created, so a mismatch leaves nothing behind.
      - name: Check tag matches the manifest version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match manifest version $version" >&2
            exit 1
          fi

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # An annotated tag answers ls-remote with the tag object, so ask for
          # the commit it dereferences to first.
          remote_commit="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -z "$remote_commit" ]; then
            remote_commit="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          fi

          if [ -n "$remote_commit" ]; then
            if [ "$remote_commit" != "$(git rev-parse HEAD)" ]; then
              echo "tag $TAG already exists and points at $remote_commit, not at $(git rev-parse HEAD)" >&2
              exit 1
            fi
            echo "tag $TAG already points at this commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      # mcpb pack archives node_modules as it finds it, so the dev
      # dependencies have to go before packing. The build above already ran
      # with them in place.
      - name: Reinstall production dependencies only
        run: npm ci --omit=dev

      - name: Pack the bundle
        run: npx --no-install mcpb pack . garmin-mcp-ts.mcpb

      - name: Checksum
        run: sha256sum garmin-mcp-ts.mcpb > garmin-mcp-ts.mcpb.sha256

      # Published as a draft: the release notes are worth a read before the
      # download links in the README start resolving to it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "$TAG" \
            garmin-mcp-ts.mcpb garmin-mcp-ts.mcpb.sha256
