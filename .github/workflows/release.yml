name: Release

# The .mcpb bundle attached to a release is the artifact submitted to the MCP
# Directory. It is built here, from the tagged commit, rather than by hand on a
# developer machine, so what users download is what the tag contains.
#
# Two ways in: pushing a v* tag, or running the workflow manually against a
# branch, in which case it creates the tag itself. The manual route exists
# because pushing a tag is not always available to whoever is cutting the
# release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v4.3.1). Created from the selected branch if it does not exist yet."
        required: true
      publish:
        description: "Publish the release instead of leaving it as a draft."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # No explicit ref: a tag push checks out the tag, a manual run checks out
      # the branch it was dispatched against. fetch-depth 0 so the tag can be
      # created and pushed from here.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "name=${INPUT_TAG:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Look the tag up on the remote
        id: existing
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # An annotated tag answers ls-remote with the tag object, so ask for
          # the commit it dereferences to first.
          commit="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [ -z "$commit" ]; then
            commit="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # A manual run naming a tag that already exists publishes what that tag
      # points at, not whatever the branch has drifted to since.
      - name: Build from the existing tag
        if: github.event_name == 'workflow_dispatch' && steps.existing.outputs.commit != ''
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG" || true
          git checkout --force "refs/tags/$TAG"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check manifest is in sync
        run: npm run check:manifest

      - name: Validate manifest against the MCPB schema
        run: npm run validate:manifest

      # A release tagged v4.3.1 carrying a 4.3.0 manifest is the first thing a
      # reviewer notices, so the tag and the manifest have to agree. Checked
      # before the tag is created, so a mismatch leaves nothing behind.
      - name: Check tag matches the manifest version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match manifest version $version" >&2
            exit 1
          fi

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch' && steps.existing.outputs.commit == ''
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      # mcpb pack archives node_modules as it finds it, so the dev
      # dependencies have to go before packing. The build above already ran
      # with them in place.
      - name: Reinstall production dependencies only
        run: npm ci --omit=dev

      # The packer is a dev dependency and has just been pruned along with the
      # rest of them, so it comes from the npx cache, outside the tree being
      # packed. The range is read from package.json to keep one source of truth.
      - name: Pack the bundle
        run: |
          range="$(node -p "require('./package.json').devDependencies['@anthropic-ai/mcpb']")"
          npx --yes "@anthropic-ai/mcpb@$range" pack . garmin-mcp-ts.mcpb

      - name: Checksum
        run: sha256sum garmin-mcp-ts.mcpb > garmin-mcp-ts.mcpb.sha256

      # A draft is invisible to the by-tag release endpoints, so the release is
      # found by listing instead. That is also what makes a re-run safe: the
      # run adds a release when there is none and otherwise leaves the existing
      # one, and its assets, alone.
      - name: Look the release up
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | first | .id // empty")"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Created as a draft: the release notes are worth a read before the
      # download links in the README start resolving to it.
      - name: Create the release
        if: steps.release.outputs.id == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "$TAG" \
            garmin-mcp-ts.mcpb garmin-mcp-ts.mcpb.sha256

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          id="${{ steps.release.outputs.id }}"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq "[.[] | select(.tag_name == \"$TAG\")] | first | .id // empty")"
          fi
          if [ -z "$id" ]; then
            echo "no release found for $TAG" >&2
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f make_latest=true --jq .html_url
